# The largest download the service accepts, in bytes: one value for the app
# and for clamd's own caps, which must not be below it — a stream above
# StreamMaxLength dies mid-INSTREAM, a file above MaxFileSize / MaxScanSize
# is skipped and reported clean. Override it with MAX_URL_SIZE in .env or
# the shell (not app.local: this setting wins over env_file). The default is
# the most libclamav scans in one file (INT_MAX - 2); the app refuses to
# start above it while clamav scans.
x-max-url-size: &max_url_size ${MAX_URL_SIZE:-2147483645}

services:
  app:
    build:
      context: .
      target: runtime-dev
    volumes:
      - ./:/app
    ports:
      - 8090:8090
    depends_on:
      clamav:
        condition: service_healthy
      redis:
        condition: service_started
    # Dev config lives in deploy/env/ (Messages convention): committed
    # app.defaults + gitignored app.local overrides (`make create-env-files`).
    env_file:
      - deploy/env/app.defaults
      - deploy/env/app.local
    environment:
      MAX_URL_SIZE: *max_url_size

  worker:
    build:
      context: .
      target: runtime-dev
    command: python -m worker
    volumes:
      - ./:/app
    depends_on:
      clamav:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - deploy/env/app.defaults
      - deploy/env/app.local
    environment:
      MAX_URL_SIZE: *max_url_size
      # Auto-reload the worker on code changes in dev.
      WORKER_WATCH: /app/src

  clamav:
    image: clamav/clamav:1.4
    # clamav publishes amd64 only; pin it so arm64 dev hosts run it emulated
    # (no-op on amd64 CI). Needs QEMU: `docker run --privileged --rm tonistiigi/binfmt --install amd64`.
    platform: linux/amd64
    ports:
      - 3310:3310
    # clamd's caps follow MAX_URL_SIZE (see the top of this file); a bare
    # number is bytes to clamd.conf, which the image builds from
    # CLAMD_CONF_<Option>. The limits are inclusive: a file of exactly
    # MAX_URL_SIZE streams and scans. MaxScanTime (ms, default 120 s) is
    # raised for a file that size, and AlertExceedsMax makes clamd report
    # any limit it hits instead of answering OK on a partial scan; the
    # backend maps that report to an unscannable verdict.
    environment:
      CLAMD_CONF_StreamMaxLength: *max_url_size
      CLAMD_CONF_MaxFileSize: *max_url_size
      CLAMD_CONF_MaxScanSize: *max_url_size
      CLAMD_CONF_MaxScanTime: "900000"
      CLAMD_CONF_AlertExceedsMax: "yes"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  # Optional second scanner (profile: exav). exav speaks the clamd protocol and
  # loads ClamAV's databases, so it shares clamav's downloaded signature volume
  # (read-only) and needs no updater of its own. Its image is gated/unpublished
  # today — build from https://github.com/sylvinus/exav or point at your registry.
  # Bring it up with:  docker compose --profile exav up -d exav
  # then `make test` runs the exav-marked tests (otherwise they skip).
  exav:
    profiles: ["exav"]
    image: ghcr.io/sylvinus/exav:latest
    platform: linux/amd64
    depends_on:
      clamav:
        condition: service_healthy
    env_file:
      - deploy/env/exav.defaults
      - deploy/env/exav.local
    volumes:
      - clamav_data:/var/lib/clamav:ro
    ports:
      - 3311:3310

  # Broker for async scans. Redis 7+ for the dramatiq-redis-streams consumer
  # groups. The service is otherwise stateless (results are pushed via webhook).
  redis:
    image: redis:7-alpine
    ports:
      - 6380:6379

volumes:
  clamav_data:
