# Default values for file-scanner.
#
# Two processes run off the same image: the API (`app`) and the dramatiq
# worker (`worker`). Both are required for async scans. ClamAV and Redis can
# be bundled here or pointed at external instances.

image:
  repository: ghcr.io/suitenumerique/file-scanner
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

# ---------------------------------------------------------------------------
# Configuration (non-secret) — every key lands in the shared ConfigMap as an
# environment variable for both the app and the worker, so any setting from
# docs/deployment.md can be added here (e.g. JWT_LEEWAY: "10"), not only the
# ones listed. Keys set to "" are omitted.
# ---------------------------------------------------------------------------
config:
  APP_CONFIG: config.ProductionConfig
  # Accepted callers: "iss:base64url-ed25519-pubkey,…". Public keys only —
  # fine in a ConfigMap. Empty ⇒ every request is 401.
  JWT_ISSUER_KEYS: ""
  JWT_AUDIENCE: file-scanner
  JWT_ISSUER: file-scanner
  # Label advertised with the webhook-signing key (any stable string).
  JWT_SIGNING_KID: ""
  DEFAULT_SCANNERS: '{"malware": ["clamav"]}'
  DEFAULT_CATEGORIES: malware
  # Overrides the bundled clamav service address when set (e.g. an external
  # daemon pool "host:3310,host2:3310").
  CLAMAV_HOSTS: ""
  EXAV_HOSTS: ""
  MAX_UPLOAD_SIZE: "104857600"
  MAX_URL_SIZE: "2147483648"
  URL_DOWNLOAD_TIMEOUT: "30"
  DOWNLOAD_MAX_SECONDS: "300"
  ENCRYPTION_MAX_CHUNK_SIZE: "52428800"
  WEBHOOK_TIMEOUT: "10"
  WEBHOOK_MAX_ATTEMPTS: "3"
  # 0 = stateless (webhook_url mandatory); > 0 keeps results in Redis for
  # GET /api/v1.0/jobs/{id}.
  WORKER_RESULT_TTL: "0"
  ALLOWED_URL_HOSTS: ""
  # Hostnames allowed to resolve to a private address, comma-separated. Any
  # URL the scanner fetches or calls back (the caller's file URL, its
  # webhook_url) is refused with SSRFValidationError when its host resolves
  # to a private address unless the exact host is listed — which is the
  # case for an in-cluster caller (a Service name, or a public name that
  # split DNS resolves internally).
  SSRF_ALLOWED_HOSTS: ""
  WORKER_DASHBOARD_PATH: /dashboard
  WORKER_DASHBOARD_USER: ""
  WORKER_DASHBOARD_ALLOWED_IPS: ""
  WORKER_DASHBOARD_FORWARDED_IP_HEADER: ""

# Secrets — either inline here (rendered into a Secret) or the name of an
# existing Secret carrying the same keys. Only non-empty inline values are
# written.
secrets:
  existingSecret: ""
  # base64url raw Ed25519 private seed signing outgoing webhooks.
  JWT_SIGNING_KEY: ""
  # If set, /metrics requires "Authorization: Bearer <key>".
  PROMETHEUS_API_KEY: ""
  # Setting a password enables the queue dashboard on the app.
  WORKER_DASHBOARD_PASSWORD: ""
  JCOP_API_KEY: ""
  # Only read when redis.enabled is false.
  WORKER_BROKER_URL: ""

# Extra environment on both processes (raw k8s EnvVar entries).
extraEnv: []

# ---------------------------------------------------------------------------
# API process
# ---------------------------------------------------------------------------
app:
  replicaCount: 2
  port: 8090
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  # /tmp backs the sync /api/v1.0/scan upload spool; size it above
  # MAX_UPLOAD_SIZE × concurrent uploads.
  tmpSizeLimit: 1Gi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

service:
  type: ClusterIP
  port: 80
  annotations: {}

# The default rule publishes the whole app, /metrics included; it is only
# protected once secrets.PROMETHEUS_API_KEY is set. Otherwise restrict the
# paths to the API (/api) or scrape through the Service instead.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: scanner.example.org
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ---------------------------------------------------------------------------
# Worker process (async scans + webhook delivery)
# ---------------------------------------------------------------------------
worker:
  replicaCount: 1
  processes: 2
  threads: 8
  # Space-separated queues. Run a second release/deployment with "webhooks"
  # only to keep callbacks prompt under a scan backlog (see
  # docs/deployment.md#queues).
  queues: "webhooks scans"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  # Scratch dir for async downloads (DOWNLOAD_DIR). One file per running scan:
  # size it above MAX_URL_SIZE × processes × threads worst case, or lower the
  # concurrency.
  downloadDir: /tmp/file-scanner
  downloadSizeLimit: 8Gi
  # /tmp itself (the root filesystem is read-only); downloads have their
  # own volume above.
  tmpSizeLimit: 256Mi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

# ---------------------------------------------------------------------------
# Bundled ClamAV daemon
# ---------------------------------------------------------------------------
clamav:
  enabled: true
  # clamav/clamav is published for linux/amd64 only; the nodeSelector below
  # keeps the pod off arm64 nodes in a mixed cluster.
  image:
    repository: clamav/clamav
    tag: "1.4"
    pullPolicy: IfNotPresent
  # More than one replica needs a ReadWriteMany signature volume (or no
  # persistence): the chart refuses to render otherwise.
  replicaCount: 1
  port: 3310
  # clamd's own size caps. They must clear MAX_URL_SIZE: a bigger stream is
  # cut mid-INSTREAM ("Size limit reached"), and a file over MaxFileSize is
  # skipped and reported clean. Rendered as CLAMD_CONF_<Option>.
  conf:
    StreamMaxLength: 2200M
    MaxFileSize: 2200M
    MaxScanSize: 2200M
    # Where INSTREAM data is spooled: the tmp volume below.
    TemporaryDirectory: /tmp
  # Extra clamd.conf options, same mapping (e.g. MaxThreads: "12").
  extraConf: {}
  # Signature database (~350 MB, refreshed by the bundled freshclam). It is
  # a cache: a fresh volume is re-downloaded on first start. Add
  # helm.sh/resource-policy: keep to the annotations to survive uninstall.
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 2Gi
    existingClaim: ""
    annotations: {}
  # clamd spools each INSTREAM to /tmp before scanning, one file per
  # concurrent stream: the worst case is StreamMaxLength × MaxThreads (clamd
  # defaults MaxThreads to 10, i.e. ~22 GiB at 2200M), which this covers.
  # A cap, not a reservation: the node's ephemeral storage must actually
  # hold it, or lower it and cap MaxThreads in extraConf.
  tmpSizeLimit: 24Gi
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      memory: 4Gi
  # The image is started through the chart's own entrypoint (no root
  # needed, see files/clamav-entrypoint.sh) as the image's clamav user, so
  # it fits a "restricted" Pod Security namespace.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  # First start downloads the full signature set; give it time.
  startupProbe:
    periodSeconds: 10
    failureThreshold: 90
  nodeSelector:
    kubernetes.io/arch: amd64
  tolerations: []
  affinity: {}

# ---------------------------------------------------------------------------
# Bundled Redis broker (single node, no persistence needed — the queue is
# transient by design). Set enabled: false and secrets.WORKER_BROKER_URL to
# use a managed Redis.
# ---------------------------------------------------------------------------
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

# Restrict the bundled redis (no password) and clamd (no auth) to the app
# and worker pods. Needs a CNI that enforces NetworkPolicy.
networkPolicy:
  enabled: false

metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
    # Name of a Secret with key "token" holding PROMETHEUS_API_KEY, when set.
    bearerTokenSecret: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
