apiVersion: v1
kind: Service
metadata:
  name: {{ include "file-scanner.fullname" . }}
  labels:
    {{- include "file-scanner.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "file-scanner.selectorLabels" (dict "root" . "component" "app") | nindent 4 }}
