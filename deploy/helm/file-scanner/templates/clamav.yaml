{{- if .Values.clamav.enabled }}
{{- $name := printf "%s-clamav" (include "file-scanner.fullname" .) }}
{{- if and (gt (int .Values.clamav.replicaCount) 1) .Values.clamav.persistence.enabled (eq .Values.clamav.persistence.accessMode "ReadWriteOnce") }}
{{- fail "clamav.replicaCount > 1 needs a ReadWriteMany signature volume (clamav.persistence.accessMode) or clamav.persistence.enabled=false" }}
{{- end }}
{{- if and .Values.clamav.persistence.enabled (not .Values.clamav.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels:
    {{- include "file-scanner.labels" . | nindent 4 }}
    app.kubernetes.io/component: clamav
  {{- with .Values.clamav.persistence.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - {{ .Values.clamav.persistence.accessMode }}
  {{- with .Values.clamav.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.clamav.persistence.size }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "file-scanner.labels" . | nindent 4 }}
    app.kubernetes.io/component: clamav
data:
  # Replaces the image's /init, which needs root (see the script header).
  entrypoint.sh: |
    {{- .Files.Get "files/clamav-entrypoint.sh" | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "file-scanner.labels" . | nindent 4 }}
    app.kubernetes.io/component: clamav
spec:
  type: ClusterIP
  ports:
    - name: clamd
      port: {{ .Values.clamav.port }}
      targetPort: clamd
      protocol: TCP
  selector:
    {{- include "file-scanner.selectorLabels" (dict "root" . "component" "clamav") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "file-scanner.labels" . | nindent 4 }}
    app.kubernetes.io/component: clamav
spec:
  replicas: {{ .Values.clamav.replicaCount }}
  {{- if .Values.clamav.persistence.enabled }}
  # A ReadWriteOnce signature volume can't be shared by two pods during a
  # rolling update; recreate instead.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "file-scanner.selectorLabels" (dict "root" . "component" "clamav") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "file-scanner.selectorLabels" (dict "root" . "component" "clamav") | nindent 8 }}
      annotations:
        checksum/entrypoint: {{ .Files.Get "files/clamav-entrypoint.sh" | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Talks to nobody in the cluster: no API token in the pod.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.clamav.podSecurityContext | nindent 8 }}
      # clamd drains the connection of a scan in progress on SIGTERM; a
      # 2 GiB stream can take minutes.
      terminationGracePeriodSeconds: 300
      containers:
        - name: clamav
          image: "{{ .Values.clamav.image.repository }}:{{ .Values.clamav.image.tag }}"
          imagePullPolicy: {{ .Values.clamav.image.pullPolicy }}
          command: ["/bin/sh", "/entrypoint/entrypoint.sh"]
          securityContext:
            {{- toYaml .Values.clamav.securityContext | nindent 12 }}
          ports:
            - name: clamd
              containerPort: 3310
              protocol: TCP
          env:
            # The image maps CLAMD_CONF_<Option> onto clamd.conf at start.
            {{- range $key, $value := .Values.clamav.conf }}
            - name: CLAMD_CONF_{{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $key, $value := .Values.clamav.extraConf }}
            - name: CLAMD_CONF_{{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          startupProbe:
            exec:
              command: ["clamdscan", "--ping", "1"]
            periodSeconds: {{ .Values.clamav.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.clamav.startupProbe.failureThreshold }}
          readinessProbe:
            exec:
              command: ["clamdscan", "--ping", "1"]
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["clamdscan", "--ping", "1"]
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.clamav.resources | nindent 12 }}
          volumeMounts:
            - name: entrypoint
              mountPath: /entrypoint
              readOnly: true
            - name: signatures
              mountPath: /var/lib/clamav
            - name: tmp
              mountPath: /tmp
            # Written by the entrypoint and the daemons; the root filesystem
            # is read-only.
            - name: config
              mountPath: /config
            - name: run
              mountPath: /run/clamav
            - name: log
              mountPath: /var/log/clamav
      volumes:
        - name: entrypoint
          configMap:
            name: {{ $name }}
        - name: signatures
          {{- if .Values.clamav.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.clamav.persistence.existingClaim | default $name }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.clamav.tmpSizeLimit }}
        - name: config
          emptyDir:
            sizeLimit: 16Mi
        - name: run
          emptyDir:
            sizeLimit: 16Mi
        - name: log
          emptyDir:
            sizeLimit: 256Mi
      {{- with .Values.clamav.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.clamav.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.clamav.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
