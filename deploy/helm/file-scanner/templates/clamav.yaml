{{- if .Values.clamav.enabled }}
{{- $name := printf "%s-clamav" (include "file-scanner.fullname" .) }}
{{- if and .Values.clamav.persistence.enabled (not .Values.clamav.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels:
    {{- include "file-scanner.labels" . | nindent 4 }}
    app.kubernetes.io/component: clamav
spec:
  accessModes:
    - {{ .Values.clamav.persistence.accessMode }}
  {{- with .Values.clamav.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.clamav.persistence.size }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "file-scanner.labels" . | nindent 4 }}
    app.kubernetes.io/component: clamav
spec:
  type: ClusterIP
  ports:
    - name: clamd
      port: {{ .Values.clamav.port }}
      targetPort: clamd
      protocol: TCP
  selector:
    {{- include "file-scanner.selectorLabels" (dict "root" . "component" "clamav") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "file-scanner.labels" . | nindent 4 }}
    app.kubernetes.io/component: clamav
spec:
  replicas: {{ .Values.clamav.replicaCount }}
  {{- if .Values.clamav.persistence.enabled }}
  # A ReadWriteOnce signature volume can't be shared by two pods during a
  # rolling update; recreate instead.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "file-scanner.selectorLabels" (dict "root" . "component" "clamav") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "file-scanner.selectorLabels" (dict "root" . "component" "clamav") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # clamd drains the connection of a scan in progress on SIGTERM; a
      # 2 GiB stream can take minutes.
      terminationGracePeriodSeconds: 300
      containers:
        - name: clamav
          image: "{{ .Values.clamav.image.repository }}:{{ .Values.clamav.image.tag }}"
          imagePullPolicy: {{ .Values.clamav.image.pullPolicy }}
          ports:
            - name: clamd
              containerPort: 3310
              protocol: TCP
          env:
            # The image maps CLAMD_CONF_<Option> onto clamd.conf at start.
            {{- range $key, $value := .Values.clamav.conf }}
            - name: CLAMD_CONF_{{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $key, $value := .Values.clamav.extraConf }}
            - name: CLAMD_CONF_{{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          startupProbe:
            exec:
              command: ["clamdscan", "--ping", "1"]
            periodSeconds: {{ .Values.clamav.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.clamav.startupProbe.failureThreshold }}
          readinessProbe:
            exec:
              command: ["clamdscan", "--ping", "1"]
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["clamdscan", "--ping", "1"]
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.clamav.resources | nindent 12 }}
          volumeMounts:
            - name: signatures
              mountPath: /var/lib/clamav
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: signatures
          {{- if .Values.clamav.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.clamav.persistence.existingClaim | default $name }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.clamav.tmpSizeLimit }}
      {{- with .Values.clamav.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.clamav.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.clamav.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
