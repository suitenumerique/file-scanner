apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "file-scanner.fullname" . }}
  labels:
    {{- include "file-scanner.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{- /* CLAMAV_HOSTS is resolved in the env block (bundled service or override). */}}
  {{- if and (ne $key "CLAMAV_HOSTS") (ne (toString $value) "") }}
  {{ $key }}: {{ toString $value | quote }}
  {{- end }}
  {{- end }}
