name: Helm chart lint

"on":
  workflow_dispatch:
  pull_request:
    paths:
      - "deploy/helm/**"
      - ".github/workflows/helm-*.yml"
      - "Makefile"
  push:
    branches: [main]
    paths:
      - "deploy/helm/**"
      - ".github/workflows/helm-*.yml"
      - "Makefile"

permissions:
  contents: read

jobs:
  lint:
    name: Lint, render, check wiring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      # Same checks as `make lint-helm` locally: strict lint, the three
      # shapes we ship rendered without error, and the bundled-service
      # wiring asserted. helm's own schema validation covers the manifests.
      - run: make lint-helm
